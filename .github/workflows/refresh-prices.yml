# Daily price refresh for every set in the database. Runs here rather than on
# Vercel because a full catalog takes longer than a serverless function may run.
# Needs repository secrets NEXT_PUBLIC_SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY
# (Settings → Secrets and variables → Actions).
name: Refresh prices
on:
  schedule:
    - cron: "17 7 * * *" # daily, 07:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh every set, even ones refreshed in the last 12 hours"
        type: boolean
        default: false

concurrency:
  group: catalog-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run prices:refresh ${{ inputs.force && 'force' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PRICE_REFRESH_MIN_INTERVAL_HOURS: "12"
